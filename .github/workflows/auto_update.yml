name: Auto Market Data Update

on:
  schedule:
    # 미국장 진행 중 여러 차례 갱신 (UTC 기준)
    # 한국시간: 23:00, 00:00, 01:00, 02:00, 03:00, 04:00, 05:00, 06:00
    # 서머타임/휴장일에도 실행될 수 있으며 yfinance의 최신 가용 가격을 사용
    - cron: '0 14-21 * * 1-5'

  # 필요할 때 GitHub Actions에서 직접 실행 가능
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Update Market Data
        run: python update_data.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Auto-update market data"
          git push
