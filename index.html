<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포트폴리오 리밸런싱 & 추세추종</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 15px; background: #f4f6f8; color: #333; }
        .card { background: white; padding: 18px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        h2 { font-size: 1.1rem; margin-top: 0; margin-bottom: 12px; color: #1a1a1a; border-bottom: 2px solid #007aff; padding-bottom: 5px; }
        label { font-size: 0.85rem; color: #666; display: block; margin-top: 8px; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; }
        button { width: 100%; padding: 12px; background: #007aff; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 12px; font-size: 1rem; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
        th, td { border: 1px solid #eee; padding: 8px; text-align: right; }
        th { background: #f8f9fa; text-align: center; }
        td:first-child { text-align: left; font-weight: bold; }
        .buy { color: #d9534f; font-weight: bold; }
        .sell { color: #0275d8; font-weight: bold; }
        .status-box { padding: 10px; border-radius: 6px; background: #eef7ff; font-size: 0.9rem; margin-top: 8px; }
    </style>
</head>
<body>

<div class="card">
    <h2>📊 총 자산 입력 (원화 기준)</h2>
    <label>기존 보유 자산 평가액 (원)</label>
    <input type="number" id="existingAsset" value="9630000" placeholder="예: 9630000">
    <label>신규 투입 실탄 (원)</label>
    <input type="number" id="newCash" value="10000000" placeholder="예: 10000000">
    <button onclick="calculateRebalance()">리밸런싱 목표 계산하기</button>
</div>

<div class="card">
    <h2>🎯 통합 포트폴리오 리밸런싱 결과</h2>
    <div id="totalSummary" class="status-box">버튼을 누르면 총 자산이 계산됩니다.</div>
    <table>
        <thead>
            <tr>
                <th>종목</th>
                <th>목표비중</th>
                <th>목표금액</th>
                <th>조정 필요금액</th>
            </tr>
        </thead>
        <tbody id="rebalanceTable">
            <!-- 리밸런싱 데이터 출력 영역 -->
        </tbody>
    </table>
</div>

<div class="card">
    <h2>📈 시장 시그널 및 데이터 status</h2>
    <div id="marketData" class="status-box">data.json 로딩 중...</div>
</div>

<script>
    // 목표 포트폴리오 비중 설정 (%)
    const targetPortfolio = [
        { name: "QLD (나스닥 2배)", weight: 30 },
        { name: "QQQ (나스닥 1배)", weight: 20 },
        { name: "비자 (V)", weight: 15 },
        { name: "코카콜라 (KO) / 버크셔", weight: 15 },
        { name: "KRX 금", weight: 10 },
        { name: "외화RP (현금성)", weight: 10 }
    ];

    function calculateRebalance() {
        const existing = parseFloat(document.getElementById('existingAsset').value) || 0;
        const newMoney = parseFloat(document.getElementById('newCash').value) || 0;
        const totalAsset = existing + newMoney;

        document.getElementById('totalSummary').innerHTML = 
            `<b>총 운용 자산:</b> ${totalAsset.toLocaleString()} 원 <br><small>(기존: ${existing.toLocaleString()}원 + 신규: ${newMoney.toLocaleString()}원)</small>`;

        const tbody = document.getElementById('rebalanceTable');
        tbody.innerHTML = '';

        targetPortfolio.forEach(item => {
            const targetAmount = totalAsset * (item.weight / 100);
            
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.name}</td>
                <td style="text-align:center;">${item.weight}%</td>
                <td>${Math.round(targetAmount).toLocaleString()} 원</td>
                <td class="buy">+${Math.round(targetAmount).toLocaleString()} 원</td>
            `;
            tbody.appendChild(tr);
        });
    }

    // 자동 수집된 market data 로드
    async function loadMarketData() {
        try {
            const response = await fetch('data.json');
            if (!response.ok) throw new Error('Data not found');
            const data = await response.json();
            
            document.getElementById('marketData').innerHTML = `
                <b>최종 업데이트:</b> ${data.updated_at || 'N/A'}<br>
                <b>QQQ 종가:</b> $${data.QQQ?.close || '-'}<br>
                <b>QQQ 120일 이평:</b> $${data.QQQ?.ma120 || '-'}<br>
                <b>QQQ 200일 이평:</b> $${data.QQQ?.ma200 || '-'}<br>
                <b>환율 (USD/KRW):</b> ${data.exchange_rate || '-'} 원
            `;
        } catch (e) {
            document.getElementById('marketData').innerHTML = 'data.json 파일이 없거나 로드할 수 없습니다.';
        }
    }

    // 초기 실행
    calculateRebalance();
    loadMarketData();
</script>

</body>
</html>
